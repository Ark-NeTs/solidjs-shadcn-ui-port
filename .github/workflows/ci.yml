name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NODE_VERSION: '25.3.0'
  BUN_VERSION: '1.4.2'
  THEME_PORT: '4403'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  checks:
    name: Types, lint, units and SSR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck
        run: bun run check
      - name: Lint
        run: bun run lint
      - name: Units and coverage thresholds
        run: bun run test:coverage
      - name: Server rendering
        run: bun run test:server
      - name: Captured public import contract
        run: bun run parity:admin
      - name: Retain failed coverage diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-failure-${{ github.run_attempt }}
          path: coverage/
          retention-days: 3
          if-no-files-found: ignore

  browser:
    name: Browser / ${{ matrix.browser }} / ${{ matrix.suite.name }} (${{ matrix.suite.part }}/${{ matrix.suite.parts }})
    # Existing Chromium screenshots were reviewed on macOS 15 arm64; WebKit keeps
    # macOS keyboard behavior. Firefox has no baselines and runs on Linux capacity.
    runs-on: ${{ matrix.browser == 'firefox' && 'ubuntu-24.04' || 'macos-15' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        suite:
          - {name: integration, part: 1, parts: 2, timeout: 1200000}
          - {name: integration, part: 2, parts: 2, timeout: 1200000}
          - {name: e2e, part: 1, parts: 1, timeout: 900000}
          - {name: hydration, part: 1, parts: 1, timeout: 900000}
          - {name: consumer, part: 1, parts: 1, timeout: 120000}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install isolated consumer dependencies
        if: ${{ matrix.suite.name == 'consumer' }}
        working-directory: validation/consumer-stack
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install pinned browser
        run: bunx --no-install playwright install --with-deps ${{ matrix.browser }}
      - name: ${{ matrix.suite.name }} acceptance
        env:
          RESULTS_FILE: test-results/reports/${{ matrix.suite.name }}.json
        run: bun run test:${{ matrix.suite.name }} --project=${{ matrix.browser }} --shard=${{ matrix.suite.part }}/${{ matrix.suite.parts }} --output=test-results/${{ matrix.suite.name }} --global-timeout=${{ matrix.suite.timeout }}
      - name: Retain failure screenshots and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ matrix.browser }}-${{ matrix.suite.name }}-${{ matrix.suite.part }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

  documentation:
    name: Documentation and public artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install local deployment tools
        working-directory: deployment
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck documented compositions
        run: bun run docs:check
      - name: Generate maintained documentation
        run: bun run docs:generate
      - name: Install pinned browsers and system libraries
        run: bunx --no-install playwright install --with-deps chromium firefox webkit
      - name: Documentation navigation and accessibility
        env:
          RESULTS_FILE: test-results/reports/docs-source.json
        run: bunx --no-install playwright test tests/integration/docs-site.spec.ts --output=test-results/docs-source --global-timeout=300000
      - name: Public build, content boundaries and local provider acceptance
        env:
          RESULTS_FILE: test-results/reports/public-site.json
        run: bun run test:site --output=test-results/public-site --global-timeout=300000
      - name: Retain documentation failure screenshots and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-failure-${{ github.run_attempt }}
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
